name: Build Sn Call Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync offline SnCall.html into Android WebView assets
        run: |
          mkdir -p android/app/src/main/assets
          cp public/SnCall.html android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Android unit tests
        run: gradle -p android testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: |
          gradle -p android assembleDebug --no-daemon
          mkdir -p release-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/SnCall-v1.1.0-debug.apk
          ls -lh release-apks/SnCall-v1.1.0-debug.apk

      - name: Build Signed Release APK (when signing secrets are configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
            export ANDROID_KEYSTORE_PATH="$PWD/android/app/release-keystore.jks"
            gradle -p android assembleRelease --no-daemon
            cp android/app/build/outputs/apk/release/app-release.apk release-apks/SnCall.apk
            rm -f android/app/release-keystore.jks
          else
            echo "Release signing secrets not configured; continuing with debug APK."
          fi

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnCall-APK-v1.1.0
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Sn Call v1.1.0 — Lock Screen & Background Calls
          body: |
            ## Sn Call v1.1.0 — Lock Screen & Background Incoming Calls
            - **Works When Phone Is Locked (Screen OFF):** Wakes the screen and launches the fullscreen Google Phone Incoming Call UI directly over the lock screen via Android `AlarmManager` + `FullScreenIntent` + `showWhenLocked`/`turnScreenOn`.
            - **Works While Using Other Apps:** Pops up over other apps (WhatsApp, YouTube, Home screen) with real ringtone, vibration, and Answer/Decline controls.
            - **Background Fake SMS Notifications:** Scheduled SMS fires as a real Android system heads-up notification even on lock screen or in other apps.
            - **Persistent Custom MP3 Ringtone:** Selected MP3 is copied offline to app storage so it plays natively even when the phone is locked.

            > **Note:** `SnCall-v1.1.0-debug.apk` is a debug-signed APK built automatically by GitHub Actions (installable directly on Android).
          files: release-apks/*.apk
          make_latest: true
